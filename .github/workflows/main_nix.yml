name: "Build & Test (nix)"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
    - name: Run the Magic Nix Cache
      uses: DeterminateSystems/magic-nix-cache-action@main
    - name: Build & check
      run: |
        nix fmt -- --check . --exclude ./example/
        nix build
        nix flake check
    # The integration tests drive a real `nix` against real flakes, so they
    # cannot run inside the build sandbox (where they skip themselves).
    - name: Integration tests
      run: nix develop --command python -m pytest tests/test_integration.py -v