name: "Build & Test (nix)"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - uses: cachix/cachix-action@v17
      with:
        name: nix-auto-follow
        authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

    - name: Build & check
      run: |
        nix fmt -- --check . --exclude ./example/
        nix build
        nix flake check
    # The integration tests drive a real `nix` against real flakes, so they
    # cannot run inside the build sandbox (where they skip themselves).
    - name: Integration tests
      run: nix develop --command python -m pytest tests/test_integration.py -v